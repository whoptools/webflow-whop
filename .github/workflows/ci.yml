name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run bundle
      - name: Verify production container
        run: |
          docker build --build-arg PUBLIC_URL=https://app.example -t whop-checkout:test .
          docker run -d --name checkout-test -p 4319:4319 -e PUBLIC_URL=https://app.example -e TOKEN_ENCRYPTION_KEY=$(openssl rand -hex 32) whop-checkout:test
          for attempt in 1 2 3 4 5; do
            if curl --fail http://localhost:4319/health; then exit 0; fi
            sleep 2
          done
          docker logs checkout-test
          exit 1
      - name: Verify Hetzner Compose, secrets, and backups
        env:
          APP_DOMAIN: app.example
          APP_IMAGE_TAG: test
          WEBFLOW_CLIENT_ID: ci-client
          EXTENSION_ORIGINS: https://extension.example
        run: |
          mkdir -m 700 secrets
          openssl rand -hex 32 > secrets/token_encryption_key
          printf '%s' 'ci-only-placeholder' > secrets/webflow_client_secret
          chmod 600 secrets/*
          sudo chown 1000:1000 secrets/*
          docker compose config --quiet
          docker compose up --no-build --wait app
          docker compose exec -T app node scripts/backup.mjs
          docker compose restart app
          docker compose up --no-build --wait app
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
          docker compose down
          docker network create kamal
          docker compose -f compose.yaml -f deploy/compose.kamal.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose.kamal.yaml up --no-build --wait app
          docker inspect webflow-whop-app --format '{{.HostConfig.Memory}}' | grep -qx '536870912'
          docker compose -f compose.yaml -f deploy/compose.kamal.yaml exec -T app node scripts/backup.mjs
          docker compose -f compose.yaml -f deploy/compose.kamal.yaml down
      - uses: actions/upload-artifact@v4
        with:
          name: designer-extension-development
          path: bundle.zip
          retention-days: 14
